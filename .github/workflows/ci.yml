name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — build, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      # `npm run build` = `tsc -b && vite build` — typecheck + production build.
      - run: npm run build
      # Hermetic component/registry tests (vitest, no jsdom/network).
      - run: npm test
      # Asserts the production build produced the expected dist artifacts.
      - run: bash __tests__/build.test.sh

  lint:
    name: Backend — ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.5
      # Ruleset + excludes are defined in pyproject.toml ([tool.ruff]).
      - run: ruff check app scripts

  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.3.4
      # tests/ cover the dependency-free scoring primitives (server.pillars);
      # config (testpaths, pythonpath) lives in pyproject.toml.
      - run: pytest -q

  compliance:
    name: Compliance — secrets / raw-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Public-release guard: no secrets/PII patterns, no raw data files shipped.
      - run: bash scripts/__tests__/compliance_scan.test.sh
