name: bundle-validate

# Static validation of the Databricks Asset Bundle (databricks.yml) on PRs that
# touch it or the app source. `databricks bundle validate` needs workspace auth,
# so this job is DORMANT until CI auth exists: set the repo variable
# ENABLE_BUNDLE_VALIDATE=true and provide the DATABRICKS_HOST + DATABRICKS_CLIENT_ID
# + DATABRICKS_CLIENT_SECRET secrets (a service principal — see the deferred
# "auto-deploy from CI" work). Until then the job is skipped, not failed.
on:
  pull_request:
    branches: [main]
    paths:
      - databricks.yml
      - app/**
      - .github/workflows/bundle-validate.yml

permissions:
  contents: read

jobs:
  validate:
    if: ${{ vars.ENABLE_BUNDLE_VALIDATE == 'true' }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate -t dev
